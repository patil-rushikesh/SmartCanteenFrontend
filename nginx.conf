server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    # Demonstrate Nginx connection statistics from inside the container only.
    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }

    root /usr/share/nginx/html;
    index index.html;

    location = /env-config.js {
        alias /tmp/env-config.js;
        add_header Cache-Control "no-store" always;
    }

    # Container health checks
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed static assets
    location ~* \.(?:css|js|mjs|woff2?|eot|ttf|otf|svg|gif|png|jpe?g|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Basic security hardening headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
