name: CI and ECS release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          load: true
          tags: smartcanteen-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the production web server and runtime configuration
        run: |
          docker run -d --name ci-web -p 18081:8080 \
            -e VITE_API_BASE_URL=/api -e VITE_ENABLE_QA_TOOLS=false smartcanteen-frontend:ci
          curl --fail --retry 20 --retry-delay 2 --retry-all-errors http://localhost:18081/healthz
          curl --fail http://localhost:18081/login
          curl --fail http://localhost:18081/env-config.js | grep -q '"VITE_API_BASE_URL": "/api"'
      - name: Container diagnostics
        if: failure()
        run: docker logs ci-web 2>&1 || true
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_AWS_DEPLOYMENT == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: exam
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_TEMPLATE: ${{ vars.ECS_TASK_TEMPLATE }}
      ECS_DESIRED_COUNT: ${{ vars.ECS_DESIRED_COUNT || '1' }}
      APP_URL: ${{ vars.APP_URL }}
      ALLOW_HTTP_DEMO: ${{ vars.ALLOW_HTTP_DEMO }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate release configuration
        run: |
          test -n "$AWS_REGION" && test -n "$ECS_CLUSTER" && test -n "$ECS_SERVICE"
          test -n "$ECR_REPOSITORY" && test -n "$APP_URL"
          case "$APP_URL" in https://*) ;; http://*) test "$ALLOW_HTTP_DEMO" = true ;; *) exit 1 ;; esac
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd
        id: ecr
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          provenance: true
          sbom: true
      - name: Download the service task template
        run: |
          if [ -z "$ECS_TASK_TEMPLATE" ]; then
            ECS_TASK_TEMPLATE=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)
          fi
          aws ecs describe-task-definition --task-definition "$ECS_TASK_TEMPLATE" --query taskDefinition > task-definition.json
      - uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea
        id: task
        with:
          task-definition: task-definition.json
          container-name: frontend
          image: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${{ steps.image.outputs.digest }}
      - uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de
        id: deploy
        with:
          task-definition: ${{ steps.task.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: false
      - name: Scale and verify the new revision
        env:
          NEW_TASK_DEFINITION: ${{ steps.deploy.outputs.task-definition-arn }}
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --desired-count "$ECS_DESIRED_COUNT" > /dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          actual=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)
          test "$actual" = "$NEW_TASK_DEFINITION"
          curl --fail --retry 10 --retry-all-errors --retry-delay 5 "$APP_URL/healthz"
